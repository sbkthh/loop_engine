name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install pytest requests cryptography
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest.log
      - name: Surface failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -30 | while IFS= read -r line; do
            echo "::error title=pytest::${line}"
          done
