[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engine"
version = "0.1.0"
description = "Deterministic development orchestration engine"
requires-python = ">=3.9"

[project.scripts]
loop_engine = "cli:main"

[tool.setuptools]
py-modules = [
    "cli", "machine", "state", "spec_utils",
    "directives", "parser", "report", "setup",
    "registry", "scheduler", "constants", "__main__",
]
packages = ["wecom_server", "feishu_server"]

[tool.setuptools.package-data]
wecom_server = ["hooks/*.sh"]